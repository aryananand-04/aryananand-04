name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: aryananand-04
          outputs: |
            dist/snake.svg?color_snake=5F5FFF&color_dots[0]=0d1117&color_dots[2]=1a1a3e&color_dots[3]=2a2a6e&color_dots[4]=5F5FFF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/snake.svg
          git diff --cached --quiet || git commit -m "chore: update snake"
          git push --force-with-lease
